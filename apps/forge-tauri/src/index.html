<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #d6dde6; font-family: sans-serif; }
  #gate { max-width: 520px; margin: 80px auto; padding: 24px; border: 1px solid #26303d; border-radius: 8px; background: #11161d; }
  #gate input { width: 100%; padding: 8px; margin: 8px 0; background: #151b24; color: #d6dde6; border: 1px solid #26303d; border-radius: 4px; }
  #gate button { padding: 8px 16px; background: #1a3a5c; color: #d6dde6; border: 1px solid #2d5a8a; border-radius: 4px; cursor: pointer; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: none; display: none; }
  code { font-family: monospace; }
</style>
</head>
<body>
<div id="gate">
  <h2>Forge</h2>
  <p>Connect to a running Core server (<code>forge serve</code>):</p>
  <input id="url" value="http://127.0.0.1:8719" autocomplete="off">
  <button id="go">Connect</button>
  <p style="color:#8b98a9;font-size:12px">This shell hosts the Forge web client. All orchestration runs in Core — the shell keeps no state.</p>
</div>
<iframe id="frame" title="Forge"></iframe>
<script>
  document.getElementById('go').onclick = function () {
    var url = document.getElementById('url').value.replace(/\/$/, '') + '/app/';
    var frame = document.getElementById('frame');
    frame.src = url;
    frame.style.display = 'block';
    document.getElementById('gate').style.display = 'none';
  };
</script>
</body>
</html>
